name: ArtCraft upstream check

# Fail the job when VectorCraft or PhotoCraft move past vendor/pins.toml.
# Same priority pattern as Bevy updates: stay current with upstream.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "vendor/pins.toml"
      - "scripts/sync_artcraft.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check VectorCraft + PhotoCraft pins
        run: |
          chmod +x scripts/sync_artcraft.sh
          ./scripts/sync_artcraft.sh --check
