[workspace]
resolver = "2"
members = [
    "crates/polyforge-core",
    "crates/polyforge-ops",
    "crates/polyforge-uv",
    "crates/polyforge-io",
    "crates/polyforge-ui",
    "crates/polyforge-cad",
    "crates/polyforge-vector",
    "crates/polyforge-app",
    "crates/polyforge-bridge",
]
default-members = ["crates/polyforge-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["PolyForge Contributors"]
repository = "https://github.com/SimonTek27/polyforge"
homepage = "https://github.com/SimonTek27/polyforge"
description = "Open-source 3D polygon modeling tool built with Bevy"
keywords = ["3d", "modeling", "bevy", "cad", "editor"]
categories = ["graphics", "game-development", "multimedia"]

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "3d", "bevy_asset", "bevy_scene", "bevy_render", "bevy_core_pipeline",
    "bevy_pbr", "bevy_gltf", "bevy_ui", "bevy_text", "bevy_winit", "bevy_gizmos",
    "multi_threaded", "x11", "wayland", "default_font",
] }
bevy_egui = "0.43"
glam = "0.29"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
serde_json = "1.0"
tracing = "0.1"

polyforge-core = { path = "crates/polyforge-core" }
polyforge-ops = { path = "crates/polyforge-ops" }
polyforge-uv = { path = "crates/polyforge-uv" }
polyforge-io = { path = "crates/polyforge-io" }
polyforge-ui = { path = "crates/polyforge-ui" }
polyforge-cad = { path = "crates/polyforge-cad" }
polyforge-vector = { path = "crates/polyforge-vector" }
polyforge-bridge = { path = "crates/polyforge-bridge" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
