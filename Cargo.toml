[workspace]
members = [
    "crates/polyforge-core",
    "crates/polyforge-ops",
    "crates/polyforge-uv",
    "crates/polyforge-io",
    "crates/polyforge-ui",
    "crates/polyforge-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["PolyForge Contributors"]
repository = "https://github.com/SimonTek27/polyforge"

[workspace.dependencies]
bevy = "0.20"
bevy_egui = "0.43"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
